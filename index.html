<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wahn</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

</head>

<body>
  <div class="cursor" id="cursor">
    <span class="cursor-dot"></span>
    <span class="cursor-piece"></span>
    <span class="cursor-piece"></span>
    <span class="cursor-piece"></span>
    <span class="cursor-piece"></span>
    <span class="cursor-piece"></span>
    <span class="cursor-piece"></span>
    <span class="cursor-piece"></span>
    <span class="cursor-piece"></span>
    <span class="cursor-piece"></span>
    <span class="cursor-piece"></span>
  </div>
  <header>
    <a class="logo" href="https://www.instagram.com/wahn_.lab/?utm_source=ig_web_button_share_sheet" target="_blank" style="text-decoration:none; color:inherit;">Wahn</a>
    <button class="header-right archive-toggle" type="button" aria-expanded="false" aria-controls="archive-panel">Archive</button>
  </header>
  <div id="stage"></div>
  <aside id="archive-panel" class="archive-panel" aria-hidden="true">
    <div class="archive-panel-inner">
      <div class="archive-panel-head">
        <span>Artist Archive</span>
        <button class="archive-close" type="button" aria-label="Close archive">×</button>
      </div>
      <div class="archive-list" id="archive-list"></div>
    </div>
  </aside>
  <canvas id="fly-canvas"
    style="display:none; position:fixed; top:0; left:0; pointer-events:none; z-index:200;"></canvas>
  <div id="page-artist">
    <div class="artist-page-wrap">
      <div class="artist-page-header">
        <div style="display:flex; align-items:baseline; gap:1rem;">
          <div class="back-btn" onclick="closeArtist()"><span class="back-arr">←</span><span>Back</span></div>
          <span id="header-artist-name"
            style="font-family:'Bodoni Moda',serif; font-size:40px; letter-spacing:0.05em; color:var(--fg);"></span>
          <span id="artist-meta"
            style="font-size:14px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); position:relative; top:5px;"></span>
        </div>
        <span class="logo">Wahn</span>
      </div>
      <div class="artist-page-works" id="artist-works"></div>
    </div>
  </div>
  <script src="scripts/artists/ian.js"></script>
  <script src="scripts/artists/soeun.js"></script>
  <script src="scripts/artists/youngsun.js"></script>
  <script src="scripts/artists/minseo.js"></script>
  <script src="scripts/main.js"></script>

</body>

</html>
